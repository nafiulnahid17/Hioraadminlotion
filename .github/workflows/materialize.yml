name: Materialize Hiora Admin Source
on:
  push:
    paths:
      - '.source/hiora-admin-bundle.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified Hiora Admin source
        run: |
          tar -xJf .source/hiora-admin-bundle.tar.xz -C .
          sed -i 's#nafiulnahid17/hiora-admin.git#nafiulnahid17/Hioraadminlotion.git#g' README.md
          sed -i 's/Choose `hiora-admin`/Choose `Hioraadminlotion`/g' README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish complete Hiora admin dashboard"
            git push origin HEAD:main
          fi
